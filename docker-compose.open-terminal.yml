# Zusatz für Open Terminal (Agenten-Variante). Wird über eine Basis-Datei mit Dienst
# "openwebui" gelegt, z. B.:
#
#   docker compose -f docker-compose.dev.yml -f docker-compose.open-terminal.yml up -d
#
# Open Terminal läuft nur im internen Netz (kein Internet, kein veröffentlichter Port).
# OpenWebUI bekommt den Terminal-Server über TERMINAL_SERVER_CONNECTIONS eingetragen.
#
# Wichtig: OpenWebUI übernimmt TERMINAL_SERVER_CONNECTIONS nur, wenn die Datenbank
# noch keinen Eintrag hat (frisches Volume). Bei einem bestehenden Volume den Eintrag
# in den Admin-Einstellungen setzen. Die Werte stehen in der README.
#
# Image per Digest gepinnt, damit der Stack reproduzierbar bleibt.

services:
  open-terminal:
    image: ghcr.io/open-webui/open-terminal@sha256:1c5f9dbfb84fa4ad1c057f63b4bf78145ea08f0286005bfaeb9e01929f6d0da3
    command: ["run", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY:?OPEN_TERMINAL_API_KEY in .env setzen (openssl rand -hex 32)}
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 512
    restart: unless-stopped
    networks:
      - open-terminal-internal

  openwebui:
    environment:
      - 'TERMINAL_SERVER_CONNECTIONS=[{"id":"open-terminal","name":"Open Terminal","enabled":true,"url":"http://open-terminal:8000","path":"/openapi.json","key":"${OPEN_TERMINAL_API_KEY}","auth_type":"bearer","forward_cookies":false}]'
    networks:
      - open-terminal-internal
    depends_on:
      - open-terminal

networks:
  open-terminal-internal:
    internal: true
